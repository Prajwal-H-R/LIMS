services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lims-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lims-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # These are container paths, not host paths. They are the same locally
      # and on Azure because the bind mounts use these fixed destinations.
      APP_UPLOADS_DIR: /app/backend/uploads
      APP_CERTIFICATE_ASSETS_DIR: /app/backend/certificate_assets
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Host paths are configured per environment in the Compose .env file.
      # Local Windows example:
      #   UPLOADS_DIR=C:/Users/UserA/Desktop/uploads
      #   CERTIFICATE_ASSETS_DIR=C:/Users/UserA/Desktop/certificate_assets
      # Azure example:
      #   UPLOADS_DIR=/opt/ylims-data/uploads
      #   CERTIFICATE_ASSETS_DIR=/opt/ylims-data/certificate_assets
      # The container paths stay identical in both environments.
      - type: bind
        source: "${UPLOADS_DIR:?Set UPLOADS_DIR in the Compose environment}"
        target: /app/backend/uploads
        bind:
          create_host_path: false

      - type: bind
        source: "${CERTIFICATE_ASSETS_DIR:?Set CERTIFICATE_ASSETS_DIR in the Compose environment}"
        target: /app/backend/certificate_assets
        bind:
          create_host_path: false
    ports:
      - "8000:8000"
    networks:
      - lims-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - lims-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  lims-net:
    driver: bridge